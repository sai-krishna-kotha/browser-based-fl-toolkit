version: "3.9"

services:
  redis:
    image: redis:7
    container_name: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: fluser
      POSTGRES_PASSWORD: flpassword
      POSTGRES_DB: fldb
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  postgres-data:

# run the below command
# docker compose up -d